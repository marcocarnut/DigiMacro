<!doctype html>
<meta charset="utf-8">
<title>DigiMacro</title>
<style>
  :root {
    --bg: #fbfbfd; --fg: #16161a; --dim: #6b6b76; --line: #0002;
    --field: #fff; --ok: #0a7d32; --bad: #c02a2a; --accent: #2c5fd8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --fg: #e8e8ea; --dim: #9a9aa4; --line: #fff3;
            --field: #202027; --ok: #58d68d; --bad: #ff7b72; --accent: #7aa2f7; }
  }
  * { box-sizing: border-box; }
  body { font: 15px/1.55 system-ui, sans-serif; color: var(--fg);
         background: var(--bg); margin: 0; padding: 2.5rem 1rem 4rem; }
  main { max-width: 56rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .2rem; letter-spacing: -.01em; }
  h1 + p { margin: 0 0 1.6rem; color: var(--dim); }
  h2 { font-size: .95rem; text-transform: uppercase; letter-spacing: .06em;
       color: var(--dim); margin: 2.2rem 0 .7rem; font-weight: 600; }
  button { font: inherit; padding: .4rem .85rem; border-radius: .45rem;
           border: 1px solid var(--line); background: var(--field);
           color: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .bar { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .bar .spacer { flex: 1 }
  input { font: inherit; padding: .35rem .5rem; border-radius: .4rem;
          border: 1px solid var(--line); background: var(--field); color: inherit; }
  input.code { width: 6.5rem; font-family: ui-monospace, monospace;
               letter-spacing: .12em; text-align: center; }
  input.text { width: 100%; font-family: ui-monospace, monospace; font-size: 13px; }
  input.bad { border-color: var(--bad); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: .75rem; text-transform: uppercase;
       letter-spacing: .06em; color: var(--dim); font-weight: 600;
       padding: 0 .4rem .35rem; }
  td { padding: .2rem .4rem; vertical-align: top; }
  td.n { color: var(--dim); font-variant-numeric: tabular-nums;
         font-size: .8rem; text-align: right; white-space: nowrap;
         padding-top: .75rem; }
  .err { color: var(--bad); font-size: .8rem; padding: .1rem .4rem .4rem; }
  .meter { height: 5px; border-radius: 3px; background: var(--line);
           overflow: hidden; width: 11rem; }
  .meter i { display: block; height: 100%; background: var(--accent);
             transition: width .2s; }
  .meter.full i { background: var(--bad); }
  pre { padding: .75rem .9rem; border-radius: .45rem; background: var(--field);
        border: 1px solid var(--line); overflow-x: auto; margin: 1.2rem 0 0;
        font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .dim { color: var(--dim); }
  .pad { border: 1px solid var(--line); border-radius: .5rem; padding: .7rem;
         background: var(--field); }
  .pad .row { display: flex; gap: .3rem; flex-wrap: wrap; align-items: center;
              margin-bottom: .35rem; }
  .pad .row:last-child { margin-bottom: 0; }
  .pad button { padding: .25rem .5rem; font: 12px ui-monospace, monospace;
                background: var(--bg); min-width: 2.1rem; }
  .pad button.mod { min-width: 3.4rem; }
  .pad button.mod.on { background: var(--accent); color: #fff;
                       border-color: var(--accent); }
  .pad .sep { width: 100%; height: 0; }
  .pad label { font-size: .8rem; color: var(--dim); display: flex;
               align-items: center; gap: .3rem; margin-right: .6rem; }
  .pad label input { padding: .2rem .35rem; font: 12px ui-monospace, monospace; }
  .hint { color: var(--dim); font-size: .8rem; margin: .5rem 0 0; }
  .pick { font-size: .8rem; color: var(--dim); display: flex; gap: .4rem;
          align-items: center; }
  .pick select { font: inherit; padding: .2rem .3rem; border-radius: .35rem;
                 border: 1px solid var(--line); background: var(--field);
                 color: var(--fg); }
  details { margin-top: 2.5rem; }
  summary { cursor: pointer; color: var(--dim); }
  details table { margin-top: .8rem; max-width: 40rem; }
  details td { padding: .15rem .8rem .15rem 0; }
  details td:first-child { font-family: ui-monospace, monospace; white-space: nowrap; }
  [hidden] { display: none !important; }
  .note { font-size: .85rem; margin: .5rem 0 0; max-width: 44rem; }
  .note:empty, .prose:empty { display: none; }
  .prose { max-width: 40rem; }
  #gate { margin-top: 1.4rem; }
  .form { display: grid; grid-template-columns: max-content 6rem;
          gap: .55rem 1rem; align-items: center; margin: .9rem 0; }
  .form .check { grid-column: 1 / -1; display: flex; gap: .45rem;
                 align-items: center; }
  .form input[type=number] { width: 100%; }
  .headbar { margin: 2.2rem 0 .7rem; }
  .headbar h2 { margin: 0; }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line);
        border-bottom-width: 2px; border-radius: .25rem; padding: 0 .3rem; }
</style>

<main>
<div class="bar" style="align-items:flex-start">
  <div>
    <h1>DigiMacro</h1>
    <p data-t="tagline">Tap a code, type a macro.</p>
  </div>
  <span class="spacer"></span>
  <label class="pick"><span data-t="language">language</span>
    <select id="lang"></select>
  </label>
</div>

<div class="bar">
  <button id="connect" class="primary" data-t="connect">Connect</button>
  <span id="who" class="dim"></span>
  <span class="spacer"></span>
  <button id="write" class="primary" data-t="write" hidden>Write to the board</button>
</div>
<p class="note" id="connect-note"></p>
<p class="note" id="write-note"></p>

<!-- Connected, and not in yet: the hold, and the password if there is one. -->
<section id="gate" hidden>
  <p id="gate-lock" class="bad"></p>
  <p id="gate-msg"></p>
  <div class="bar" id="gate-pass">
    <input id="gatepass" type="password" size="16" spellcheck="false"
           autocomplete="current-password" data-ph="ph-gate-password">
    <button id="unlock" class="primary" data-t="unlock">Unlock</button>
  </div>
  <p class="note" id="gate-note"></p>
</section>

<!-- In: everything the board holds. -->
<section id="board" hidden>
<div class="bar headbar">
  <h2 data-t="macros">Macros</h2>
  <span class="spacer"></span>
  <label class="pick"><span data-t="keyboard">keyboard</span>
    <select id="layout"></select>
  </label>
</div>
<table>
  <thead><tr><th style="width:7.5rem" data-t="th-code">Code</th>
             <th data-t="th-types">Types</th>
             <th style="width:4rem"></th><th style="width:2rem"></th></tr></thead>
  <tbody id="list"></tbody>
</table>

<div class="bar" style="margin-top:1rem">
  <button id="add" data-t="add-macro">+ Add a macro</button>
  <button id="sample"></button>
  <span class="spacer"></span>
  <span id="budget" class="dim"></span>
  <span class="meter" id="meter"><i style="width:0"></i></span>
</div>
<p class="note" id="table-note"></p>

<h2 data-t="keys">Keys</h2>
<div class="pad" id="pad">
  <div class="row" id="mods"></div>
  <div class="row" id="keys1"></div>
  <div class="row" id="keys2"></div>
  <div class="row" id="keys3"></div>
  <div class="row">
    <label><span data-t="a-key">a key</span>
      <input id="keyval" size="2" maxlength="1" spellcheck="false"></label>
    <button data-ins="key" data-t="insert">insert</button>
    <label style="margin-left:.8rem"><span data-t="pause">pause</span>
      <input id="pauseval" size="3" value="1.0"></label>
    <button data-ins="pause" data-t="insert">insert</button>
    <label style="margin-left:.8rem"><span data-t="repeat">repeat</span>
      <input id="repval" size="3" value="4"></label>
    <button data-ins="rep" data-t="insert">insert</button>
    <button data-ins="group" style="margin-left:.8rem"
            title="( )">( )</button>
    <label style="margin-left:.8rem">goto <select id="gotoval"></select></label>
    <button data-ins="goto" data-t="insert">insert</button>
  </div>
</div>
<p class="hint" data-t="pad-hint"></p>

<h2 data-t="startup">Startup</h2>
<p class="dim prose" data-t="startup-why"></p>
<p class="bar">
  <label class="pick"><span data-t="on-plug">when plugged in, type</span>
    <select id="auto"></select>
  </label>
</p>
<p class="note" id="auto-note"></p>


<h2 data-t="sec-summary">Password</h2>
<p class="dim prose" id="secwhy"></p>
<div class="bar">
  <input id="passval" type="password" size="30" spellcheck="false"
         autocomplete="new-password" data-ph="ph-password">
  <button id="setpass" data-t="save">Save</button>
  <button id="clearpass" data-t="clear-password">Remove it</button>
</div>
<p class="note" id="pass-note"></p>

<h2 data-t="lock-summary">Lockout</h2>
<p class="dim prose" data-t="lock-why"></p>
<p id="lockstate" class="prose"></p>
<div class="form">
  <label class="check"><input id="lockon" type="checkbox">
    <span data-t="lock-enable"></span></label>
  <label for="locksoft" data-t="lock-soft"></label>
  <input id="locksoft" type="number" min="1" max="254" value="3">
  <label for="lockwait" data-t="lock-wait"></label>
  <input id="lockwait" type="number" min="10" max="2400" step="10" value="60">
  <label for="lockhard" data-t="lock-hard"></label>
  <input id="lockhard" type="number" min="0" max="254" value="3">
</div>
<p id="lockodds" class="dim prose"></p>
<p id="lockcount" class="dim prose"></p>
<div class="bar">
  <button id="locksave" data-t="save">Save</button>
</div>
<p class="note" id="lock-note"></p>

<details>
  <summary data-t="ref-summary">What can go in a macro</summary>
  <table>
    <tr><td>anything</td><td data-t="ref-anything"></td></tr>
    <tr><td>\n \t \\</td><td data-t="ref-escapes"></td></tr>
    <tr><td>{{</td><td data-t="ref-brace"></td></tr>
    <tr><td>{Enter} {Left} {F5}</td><td data-t="ref-named"></td></tr>
    <tr><td>{Ctrl+c} {Alt+Tab}</td><td data-t="ref-mods"></td></tr>
    <tr><td>{Ctrl+Shift+Left}</td><td data-t="ref-combined"></td></tr>
    <tr><td>{pause 1.5}</td><td data-t="ref-pause"></td></tr>
    <tr><td>x{11}</td><td data-t="ref-repeat"></td></tr>
    <tr><td>(ab){3}</td><td data-t="ref-group"></td></tr>
    <tr><td>\( \)</td><td data-t="ref-paren"></td></tr>
    <tr><td>{goto .-}</td><td data-t="ref-goto"></td></tr>
    <tr><td>á ç ã</td><td data-t="ref-accent"></td></tr>
    <tr><td>{'}</td><td data-t="ref-bare-mark"></td></tr>
  </table>
  <p class="dim prose" data-t="ref-layout"></p>
  <p class="dim prose" data-t="ref-codes"></p>
  <p class="dim prose" data-t="ref-packed"></p>
</details>
</section>
</main>

<script src="i18n.js"></script>
<script src="table.js"></script>
<script>
/* The device never stops being a keyboard. The app reaches it through a second
   top-level collection on a vendor usage page, which is the one kind WebHID
   hands over -- a protected page, keyboards among them, it will not. A feature
   report is a control transfer, so this is the protocol the vendor requests
   carried, in a different envelope. */
const VND_ID  = 2;
const VND_LEN = 36;
const DATA_AT = 4;              /* command, address low, address high, count */
const CHUNK   = VND_LEN - DATA_AT;
const F_INFO = 0x40, F_READ = 0x60, F_WRITE = 0x61;
const F_UNLOCK = 0x62, F_SETPASS = 0x63, F_REFUSED = 0xEE;
const ST_OPEN = 0x01, ST_PASSWORD = 0x02, ST_UNLOCKED = 0x04;
const ST_SOFTLOCK = 0x08, ST_HARDLOCK = 0x10;

/* The lockout's six bytes, in the firmware's map: three settings, then three
   counters stored inverted so that an erased byte is a zero. */
const LOCK_ADDR = 0x1EC;
const LOCK_LEN  = 6;
const LOCK_OFF  = 0xFF;         /* a threshold of 0 or 0xFF is no threshold */

let dev = null, eeSize = 512;
let macros = [{ code: '.', text: '' }];
let auto = AUTO_NONE;           /* the header byte of the power-on macro */
let state_byte = 0;             /* what INFO last said about the gates */

const $ = id => document.getElementById(id);
const hex2 = v => v.toString(16).padStart(2, '0');

/* Every action says what happened right under the button that started it,
   rather than in one log at the top of the page where it would go unread.
   The status beside Connect is kept as a key, so a change of language can
   say it again; the notes are what happened, and stay as they were said. */
function note(id, text, cls) {
  $(id).textContent = text;
  $(id).className = 'note' + (cls ? ' ' + cls : '');
}

let whoKey = '', whoParams = {}, whoCls = 'dim';
function who(key, params, cls) {
  whoKey = key; whoParams = params || {}; whoCls = cls || 'dim';
  renderWho();
}
function renderWho() {
  $('who').textContent = whoKey ? t(whoKey, whoParams) : '';
  $('who').className = whoCls;
}

/* ---- the device ---------------------------------------------------- */

/* Whether the report ID travels in the payload as well as in the request is
   the one thing the specification leaves to taste, so this looks rather than
   assumes: no command is 2, so a leading 2 can only be the id. Chrome does not
   send one back, and a host that did would still work. */
let idInPayload = null;

async function ask(cmd, addr = 0, count = 0, data = null) {
  const out = new Uint8Array(VND_LEN);
  out[0] = cmd; out[1] = addr & 0xFF; out[2] = addr >> 8; out[3] = count;
  if (data) out.set(data, DATA_AT);
  await dev.sendFeatureReport(VND_ID, out);

  const view = await dev.receiveFeatureReport(VND_ID);
  let b = new Uint8Array(view.buffer, view.byteOffset, view.byteLength);
  if (idInPayload === null) idInPayload = b[0] === VND_ID;
  if (idInPayload) b = b.slice(1);

  if (b[0] === F_REFUSED) throw new Error('REFUSED');
  return b;
}

/* In chunks, as writing is: a report carries 32 bytes of data, so a longer
   read asked for in one go comes back short. Verifying a write that way once
   read a whole table as a mismatch at byte 32. */
async function eeRead(addr, len) {
  const out = new Uint8Array(len);
  for (let i = 0; i < len; i += CHUNK) {
    const n = Math.min(CHUNK, len - i);
    out.set((await ask(F_READ, addr + i, n)).slice(DATA_AT, DATA_AT + n), i);
  }
  return out;
}
const eeWrite = (addr, bytes) => ask(F_WRITE, addr, bytes.length, bytes);

/* ---- the editor ---------------------------------------------------- */

/* Encode every row, so that a mistake is reported next to the row that has
   it rather than when the table is written. */
function state() {
  const each = macros.map(r => {
    try { return { bytes: encodeMacro(r.text), error: null }; }
    catch (e) { return { bytes: null, error: e.message }; }
  });

  let error = null, total = 1;              /* the terminator */
  const seen = new Set();
  macros.forEach((r, i) => {
    try { 
      const h = header(r.code);
      if (seen.has(h)) each[i].error = each[i].error || t('code-twice', { what: r.code });
      seen.add(h);
    } catch (e) { each[i].error = each[i].error || e.message; }
    if (each[i].bytes) total += each[i].bytes.length + 2;
  });
  if (total > TABLE_TOP) error = `${total} bytes of table, and only ${TABLE_TOP} fit`;
  const ok = !error && each.every(e => !e.error);
  return { each, total, error, ok };
}

/* The power-on macro is named by its code, which is what the firmware stores:
   a position would go wrong the moment the table was reordered. */
function drawAuto() {
  const sel = $('auto');
  const was = auto;
  sel.innerHTML = `<option value="">${t('nothing')}</option>`
    + macros.filter(m => { try { return header(m.code) >= 0; } catch (e) { return false; } })
            .map(m => `<option value="${header(m.code)}">${m.code}</option>`).join('');
  sel.value = was === AUTO_NONE ? '' : String(was);
  if (sel.value === '' && was !== AUTO_NONE) auto = AUTO_NONE;  /* it went away */
}

function draw() {
  const st = state();
  const tbody = $('list');
  tbody.innerHTML = '';

  macros.forEach((r, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td><input class="code${st.each[i].error ? '' : ''}" value="${r.code.replace(/"/g,'')}"
           spellcheck="false" data-i="${i}" data-f="code"></td>` +
      `<td><input class="text${st.each[i].error ? ' bad' : ''}" value="${r.text.replace(/"/g,'&quot;')}"
           spellcheck="false" data-i="${i}" data-f="text"
           placeholder="${t('ph-types')}"></td>` +
      `<td class="n">${st.each[i].bytes ? st.each[i].bytes.length + 2 : '—'} B</td>` +
      `<td><button data-del="${i}" title="remove">✕</button></td>`;
    tbody.appendChild(tr);
    if (st.each[i].error) {
      const e = document.createElement('tr');
      e.innerHTML = `<td></td><td colspan="3" class="err">${st.each[i].error}</td>`;
      tbody.appendChild(e);
    }
  });

  $('gotoval').innerHTML = macros
    .map(m => `<option>${m.code.replace(/[^.-]/g, '')}</option>`).join('');
  $('budget').textContent = t('budget', { n: st.total, max: TABLE_TOP });
  $('budget').className = st.error ? 'bad' : 'dim';
  const m = $('meter');
  m.firstElementChild.style.width =
    Math.min(100, st.total * 100 / TABLE_TOP) + '%';
  m.className = 'meter' + (st.error ? ' full' : '');
  drawAuto();
  drawWrite(st);
  drawSample();
  drawLock();                   /* the odds depend on how many codes are used */
}

$('list').addEventListener('input', e => {
  const i = +e.target.dataset.i, f = e.target.dataset.f;
  if (f === undefined) return;
  macros[i][f] = e.target.value;
  /* redraw only what is cheap to redraw, so the caret stays where it is */
  const st = state();
  $('budget').textContent = t('budget', { n: st.total, max: TABLE_TOP });
  $('budget').className = st.error ? 'bad' : 'dim';
  $('meter').firstElementChild.style.width =
    Math.min(100, st.total * 100 / TABLE_TOP) + '%';
  $('meter').className = 'meter' + (st.error ? ' full' : '');
  e.target.classList.toggle('bad', !!st.each[i].error && f === 'text');
  drawWrite(st);
});
$('list').addEventListener('change', draw);
$('list').addEventListener('click', e => {
  const d = e.target.dataset.del;
  if (d === undefined) return;
  macros.splice(+d, 1);
  if (!macros.length) macros = [{ code: '.', text: '' }];
  draw();
});

$('add').onclick = () => {
  const used = new Set(macros.map(r => r.code));
  const next = ['.', '-', '..', '.-', '-.', '--', '...', '..-', '.-.', '.--',
                '-..', '-.-', '--.', '---'].find(c => !used.has(c)) || '';
  macros.push({ code: next, text: '' });
  draw();
};

$('auto').onchange = () => {
  auto = $('auto').value === '' ? AUTO_NONE : Number($('auto').value);
  drawWrite();
};

/* Write is offered only when there is something to write: what is on screen,
   encoded, differs from what was last read from or written to the board.
   Compared as bytes rather than text, so retyping a macro the same way is no
   change, and changing the keyboard layout is one when it changes the bytes. */
let saved = null;               /* table bytes and power-on byte, as on board */

function snapshot() {
  try { return encodeTable(macros).join(',') + '/' + auto; }
  catch (e) { return null; }
}

function drawWrite(st = state()) {
  const changed = st.ok && saved !== null && snapshot() !== saved;
  $('write').disabled = !dev || busy || !changed;
}

/* One button, two jobs: the example replaces the table on screen, and then
   the same button brings back what the board holds, so trying the example
   never strands anybody's own macros. Neither touches the board itself until
   Write. */
let onSample = false;

function drawSample() {
  $('sample').textContent = t(onSample ? 'reload-table' : 'load-example');
}

$('sample').onclick = () => {
  if (!onSample) {
    macros = sampleRows();
    onSample = true;
    draw();
    note('table-note', t('sample-say'), 'dim');
    return;
  }
  run('table-note', async () => {
    note('table-note', t('gate-reading'), 'dim');
    const got = await readTable();
    note('table-note', got ? t('table-reloaded') : t('read-none'), 'dim');
  });
};

/* ---- connect, and the way in ----------------------------------------
 *
 * Three stages, and the page shows one at a time: nothing connected, so only
 * Connect; connected but not in, so only the hold and the password; and in,
 * with everything the board holds already read and on screen.
 *
 * The hold is what lets anyone in, and it lasts half a minute. Editing takes
 * longer than that, so every action asks for it again when it has lapsed and
 * waits for it rather than failing. The password is kept for as long as the
 * board stays plugged in, so that the hold is all a second save needs; it
 * lives in this page's memory and nowhere else, and unplugging the board
 * forgets it, so the next plug-in asks again.
 */
let password = null;            /* given, and right, this connection */
let busy = false;               /* one conversation with the board at a time */
let stage = 'none';             /* 'none', 'gate' or 'board' */

const sleep = ms => new Promise(r => setTimeout(r, ms));

function show(s) {
  stage = s;
  $('connect').hidden = s !== 'none';
  $('gate').hidden = s !== 'gate';
  $('board').hidden = s !== 'board';
  $('write').hidden = s !== 'board';
}

/* `ask` is whether we may put the picker up, which needs a real click behind
   it. The device coming back on its own has no click, so it takes what the
   origin was already given and stops there rather than failing noisily. */
async function connect(mayAsk) {
  note('connect-note', '');
  if (!navigator.hid) { note('connect-note', t('no-webhid'), 'bad'); return; }
  try {
    /* A device this origin already knows comes back without the picker. */
    const known = await navigator.hid.getDevices();
    dev = known.find(d => d.vendorId === 0x16c0
                       && d.collections.some(c => c.usagePage === 0xFF00));
    if (!dev && mayAsk)
      dev = (await navigator.hid.requestDevice(
               { filters: [{ vendorId: 0x16c0, usagePage: 0xFF00 }] }))[0];
    if (!dev) return;
    if (!dev.opened) await dev.open();

    const b = await ask(F_INFO);
    if (String.fromCharCode(b[1], b[2]) !== 'DM') {
      note('connect-note', t('wrong-magic'), 'bad'); dev = null; return;
    }
    eeSize = b[5] | (b[6] << 8);
    state_byte = b[7];
    who('connected', { fw: b[4], proto: b[3] }, 'ok');
    show('gate');
    gate();
  } catch (e) {
    dev = null;
    note('connect-note', t('connect-failed', { msg: e.message }), 'bad');
    /* Only when it is one: "failed to open" on Linux is a file permission
       wearing a browser's error message, but a dismissed picker is not, and
       answering the wrong question is worse than saying nothing. */
    if (navigator.userAgent.includes('Linux') && /open/i.test(e.message))
      note('connect-note', t('connect-failed', { msg: e.message }) + ' '
                           + t('udev-hint'), 'bad');
  }
}

$('connect').onclick = () => connect(true);

navigator.hid?.addEventListener('disconnect', ev => {
  if (dev && ev.device !== dev) return;
  dev = null;
  password = null;              /* the next plug-in asks again */
  $('gatepass').value = '';
  show('none');
  who('board-left', {}, 'dim');
});

navigator.hid?.addEventListener('connect', ev => {
  if (dev || ev.device.vendorId !== 0x16c0) return;
  connect(false);               /* no click behind this, so no picker */
});

/* Whether the board wants a password before it will answer: it has one, and
   either it has not been given this session or a hard lock wants it again. */
const wantsPassword = s =>
  !!(s & ST_PASSWORD) && (!(s & ST_UNLOCKED) || !!(s & ST_HARDLOCK));

/* The password, once the window is open. False if the board said no; a wrong
   one is forgotten, so it is never tried twice and never counted twice. */
async function tryUnlock(noteId) {
  const hard = !!(state_byte & ST_HARDLOCK);
  const bytes = bytesOf(password);
  try {
    await ask(F_UNLOCK, 0, bytes.length, bytes);
  } catch (e) {
    if (e.message !== 'REFUSED') throw e;
    /* No to a shut window and no to a wrong password look the same, so ask
       which before saying which. */
    await refreshState();
    if (state_byte & ST_OPEN) {
      password = null;
      note(noteId, t('wrong-password'), 'bad');
    }
    return false;
  }
  await refreshState();
  if (hard) note(noteId, t('lock-lifted'), 'ok');
  return true;
}

/* Waits for the hold, and the password if there is one, then reads the board.
   Runs until it gets in or the board goes away. */
async function gate() {
  const me = dev;
  note('gate-note', '');
  while (dev === me && stage === 'gate') {
    try {
      const s = await refreshState();
      drawGate();
      if (s & ST_OPEN) {
        if (!wantsPassword(s) || (password !== null && await tryUnlock('gate-note'))) {
          await enterBoard();
          return;
        }
      }
    } catch (e) {
      if (dev !== me) return;
      note('gate-note', e.message, 'bad');
    }
    await sleep(400);
  }
}

function drawGate() {
  const has = !!(state_byte & ST_PASSWORD);
  const open = !!(state_byte & ST_OPEN);
  $('gate-lock').textContent = state_byte & ST_HARDLOCK ? t('lock-state-hard')
                             : state_byte & ST_SOFTLOCK ? t('lock-state-soft') : '';
  $('gate-pass').hidden = !has;
  $('gate-msg').textContent = !open ? t(has ? 'gate-hold-password' : 'gate-hold')
                            : password === null ? t('gate-type-password')
                            : t('gate-reading');
  if (open && password === null && has && document.activeElement !== $('gatepass'))
    $('gatepass').focus();
}

/* The password goes in whenever it is typed; the gate tries it once the
   window is open, so it does not matter which comes first. */
function givePassword() {
  const v = $('gatepass').value;
  if (!v) { note('gate-note', t('password-empty-unlock'), 'bad'); return; }
  password = v;
  $('gatepass').value = '';
  note('gate-note', state_byte & ST_OPEN ? '' : t('gate-waiting'), 'dim');
  drawGate();
}
$('unlock').onclick = givePassword;
$('gatepass').addEventListener('keydown', e => {
  if (e.key === 'Enter') givePassword();
});

/* The table and the power-on macro, as the board holds them. How many
   macros there were, so a caller can say when there were none. */
async function readTable() {
  const got = decodeTable(await eeRead(0, TABLE_TOP));
  macros = got.length ? got : [{ code: '.', text: '' }];
  auto = (await eeRead(AUTO_ADDR, 1))[0];
  onSample = false;
  saved = snapshot();
  draw();
  note('auto-note', auto !== AUTO_NONE && $('auto').value === ''
                    ? t('auto-dangling') : '', 'dim');
  return got.length;
}

/* Everything at once: the table, the power-on macro and the lockout. */
async function enterBoard() {
  note('gate-note', t('gate-reading'), 'dim');
  for (const id of ['table-note', 'auto-note', 'write-note', 'pass-note',
                    'lock-note']) note(id, '');
  show('board');
  const got = await readTable();
  lockRead(await eeRead(LOCK_ADDR, LOCK_LEN));
  drawSecurity();
  if (!got) note('table-note', t('read-none'), 'dim');
}

/* What every action does first: the window, waited for if it has lapsed, and
   the password given again if the board has forgotten it. */
async function access(noteId) {
  let s = await refreshState();
  if (!(s & ST_OPEN)) {
    note(noteId, t('hold-now'), 'dim');
    const until = Date.now() + 60000;
    while (!(s & ST_OPEN)) {
      if (Date.now() > until) throw new Error(t('hold-timeout'));
      await sleep(400);
      s = await refreshState();
    }
  }
  if (!wantsPassword(s)) return;
  if (password !== null && await tryUnlock(noteId)) return;
  /* Still held, so the window shut in between: say that. */
  if (password !== null) throw new Error('REFUSED');
  /* Forgotten as wrong -- changed from somewhere else, most likely. Back to
     the way in, which is where a password is asked for. */
  show('gate');
  gate();
  note('gate-note', t('wrong-password'), 'bad');
  throw new Error(t('wrong-password'));
}

/* An action: one at a time, its buttons quiet while it runs, and whatever
   happens said beside the button that started it. */
const ACTION_BUTTONS = ['write', 'sample', 'setpass', 'clearpass', 'locksave'];

async function run(noteId, fn) {
  if (busy || !dev) return;
  busy = true;
  ACTION_BUTTONS.forEach(id => $(id).disabled = true);
  try {
    await access(noteId);
    await fn();
  } catch (e) {
    note(noteId, e.message === 'REFUSED' ? t('refused') : e.message, 'bad');
  } finally {
    busy = false;
    $('sample').disabled = false;
    $('clearpass').disabled = false;
    draw();                     /* Write, and Save twice: each enables itself
                                   only when it has something to save */
    drawSecurity();
  }
}

/* ---- writing the table ---------------------------------------------- */

$('write').onclick = () => {
  let bytes;
  try { bytes = encodeTable(macros); }
  catch (e) { note('write-note', e.message, 'bad'); return; }

  run('write-note', async () => {
    note('write-note', t('writing'), 'dim');
    for (let i = 0; i < bytes.length; i += CHUNK)
      await eeWrite(i, bytes.slice(i, i + CHUNK));
    const back = await eeRead(0, bytes.length);
    const bad = [...bytes].findIndex((v, i) => back[i] !== v);
    if (bad >= 0) {
      note('write-note', t('write-mismatch', { at: bad, wrote: hex2(bytes[bad]),
                                              read: hex2(back[bad]) }), 'bad');
      return;
    }
    await eeWrite(AUTO_ADDR, Uint8Array.from([auto]));
    onSample = false;           /* what is on screen is on the board now */
    saved = snapshot();
    note('table-note', '');
    note('auto-note', '');
    note('write-note', t('write-ok', { n: bytes.length }), 'ok');
  });
};

/* ---- the password, which most boards will not have --------------------
 *
 * Absent by default and no worse for it: plenty of macros are not secret, and
 * a board that types eleven right-arrows at a television should not ask
 * anybody for anything. So this section says what is true and offers the
 * change, rather than suggesting anything is wrong.
 */
function drawSecurity() {
  const has = !!(state_byte & ST_PASSWORD);
  $('secwhy').textContent = t(has ? 'sec-has' : 'sec-none');
  $('clearpass').hidden = !has;
  $('setpass').disabled = busy || !$('passval').value;
  drawLock();
}

async function refreshState() {
  const b = await ask(F_INFO);
  state_byte = b[7];
  if (stage === 'board') drawSecurity();
  return state_byte;
}

const bytesOf = s => new TextEncoder().encode(s).slice(0, 12);

$('passval').addEventListener('input', drawSecurity);

$('setpass').onclick = () => {
  const given = $('passval').value;
  if (!given) { note('pass-note', t('password-empty'), 'bad'); return; }
  run('pass-note', async () => {
    const bytes = bytesOf(given);
    await ask(F_SETPASS, 0, bytes.length, bytes);
    password = given;
    $('passval').value = '';
    await refreshState();
    note('pass-note', t('password-set'), 'ok');
  });
};

$('clearpass').onclick = () => run('pass-note', async () => {
  await ask(F_SETPASS, 0, 0, null);
  password = null;
  await refreshState();
  note('pass-note', t('password-cleared'), 'ok');
});

/* ---- the lockout ----------------------------------------------------
 *
 * Settings and counters are plain EEPROM bytes, read and written like the
 * table: the firmware only ever counts and checks. It needs a password, which
 * is the only thing that lifts a hard lock, so it cannot be switched on
 * without one -- and the firmware ignores it without one in any case.
 */
let lockCounts = null;          /* misses, soft locks in a row, hard locks
                                   lifted -- as last read, or null */

function lockRead(b) {
  const on = b[0] !== 0 && b[0] !== LOCK_OFF;
  $('lockon').checked = on;
  if (on) $('locksoft').value = b[0];
  $('lockhard').value = b[1] === LOCK_OFF ? 0 : b[1];
  $('lockwait').value = (b[2] >= 1 && b[2] <= 240 ? b[2] : 6) * 10;
  lockCounts = { misses: 255 - b[3], softs: 255 - b[4], cleared: 255 - b[5] };
  lockSaved = String(lockWanted());
  drawLock();
}

/* The three setting bytes the form stands for, or null if it makes no sense. */
let lockSaved = null;
function lockWanted() {
  if (!$('lockon').checked) return [LOCK_OFF, LOCK_OFF, LOCK_OFF];
  const s = lockSettings();
  return s.ok ? [s.soft, s.hard || LOCK_OFF, s.tens] : null;
}

/* What the settings would let through, in the page's own numbers. */
function lockSettings() {
  const soft = parseInt($('locksoft').value, 10);
  const hard = parseInt($('lockhard').value, 10);
  const secs = parseInt($('lockwait').value, 10);
  const ok = soft >= 1 && soft <= 254 && hard >= 0 && hard <= 254
          && secs >= 10 && secs <= 2400 && secs % 10 === 0;
  return { ok, soft, hard, tens: secs / 10 };
}

const fmtWait = tens => tens < 6 ? `${tens * 10} s`
  : tens % 6 ? `${Math.floor(tens / 6)} min ${(tens % 6) * 10} s`
  : `${tens / 6} min`;

function drawLock() {
  const has = !!(state_byte & ST_PASSWORD);
  const on = $('lockon').checked;
  const want = lockWanted();
  $('locksave').disabled = busy || !want || String(want) === lockSaved
                         || (on && !has);
  $('lockon').disabled = !has;
  for (const id of ['locksoft', 'lockwait', 'lockhard'])
    $(id).disabled = !on || !has;

  $('lockstate').textContent =
      state_byte & ST_HARDLOCK ? t('lock-state-hard')
    : state_byte & ST_SOFTLOCK ? t('lock-state-soft')
    : !has ? t('lock-needs-password') : '';
  $('lockstate').className = 'prose ' + (has ? 'bad' : 'dim');

  const s = lockSettings();
  const n = macros.filter(m => m.code).length;
  $('lockodds').textContent = !on || !has ? ''
    : !s.ok ? t('lock-bad')
    : t(s.hard ? 'lock-odds' : 'lock-odds-nohard', {
        tries: s.soft * s.hard, soft: s.soft, hard: s.hard, wait: fmtWait(s.tens), n,
        pct: Math.round(n * 100 / 62) });
  $('lockcount').textContent = lockCounts && has ? t('lock-counts', lockCounts) : '';
}

for (const id of ['lockon', 'locksoft', 'lockwait', 'lockhard'])
  $(id).addEventListener('input', drawLock);

/* Saving starts the counts again from zero, so that new settings are not
   judged by what the old ones let happen. The record of hard locks lifted is
   left alone: it is history, not state. */
$('locksave').onclick = () => {
  const on = $('lockon').checked, s = lockSettings();
  if (on && !s.ok) { note('lock-note', t('lock-bad'), 'bad'); return; }
  if (on && !(state_byte & ST_PASSWORD)) {
    note('lock-note', t('lock-needs-password'), 'bad'); return;
  }
  run('lock-note', async () => {
    const bytes = on
      ? [s.soft, s.hard || LOCK_OFF, s.tens, 0xFF, 0xFF]
      : [LOCK_OFF, LOCK_OFF, LOCK_OFF, 0xFF, 0xFF];
    await eeWrite(LOCK_ADDR, Uint8Array.from(bytes));
    lockRead(await eeRead(LOCK_ADDR, LOCK_LEN));
    await refreshState();
    note('lock-note', t(on ? 'lock-saved' : 'lock-off-saved'), 'ok');
  });
};

/* ---- what language to say it in ------------------------------------- */

/* table.js keeps English as its default and the tests read it, so the app
   hands it a translator rather than the strings living in two places. */
setMessages((key, params) => t(key, params));

$('lang').innerHTML = Object.keys(STRINGS)
  .map(k => `<option value="${k}">${STRINGS[k]['lang-name']}</option>`).join('');

function useLang(l) {
  setLang(l);
  $('lang').value = getLang();
  try { localStorage.setItem('digimacro.lang', getLang()); } catch (e) {}
  applyLang();
  renderWho();
  drawSecurity();               /* its text is chosen, not marked up */
  if (stage === 'gate') drawGate();
  drawPad();                    /* its labels are built, not marked up */
  draw();                       /* and so are the rows and the budget */
}

$('lang').onchange = () => useLang($('lang').value);

/* ---- which keyboard the board will be plugged into ------------------ */

/* The board sends scan codes, so an accent is the host's business, not ours.
   On a layout with dead keys it is the accent and then the letter; on a plain
   US one it cannot be typed at all. Saying which is here rather than guessed,
   because guessing wrong types something else without saying so. */
$('layout').innerHTML = Object.entries(LAYOUTS)
  .map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('');

try {
  const saved = localStorage.getItem('digimacro.layout');
  if (saved) { setLayout(saved); $('layout').value = getLayout(); }
} catch (e) { /* private windows have no localStorage; the default will do */ }

$('layout').onchange = () => {
  setLayout($('layout').value);
  try { localStorage.setItem('digimacro.layout', getLayout()); } catch (e) {}
  draw();                       /* what was invalid may now be valid */
};

/* ---- the key palette ----------------------------------------------- */

/* Which macro was last being edited, so a key lands where the cursor was.
   The palette's buttons cancel their own mousedown, so the field never loses
   focus and the cursor never moves. */
let lastField = null;
$('list').addEventListener('focusin', e => {
  if (e.target.dataset.f === 'text') lastField = e.target;
});

function insert(text) {
  const el = lastField && lastField.isConnected
           ? lastField : document.querySelector('#list input.text');
  if (!el) return;
  el.focus();
  const a = el.selectionStart, b = el.selectionEnd;
  el.value = el.value.slice(0, a) + text + el.value.slice(b);
  el.setSelectionRange(a + text.length, a + text.length);
  el.dispatchEvent(new Event('input', { bubbles: true }));
  lastField = el;
}

let armed = [];                         /* modifiers waiting for a key */

function insertKey(name) {
  insert(armed.length ? `{${armed.join('+')}+${name}}` : `{${name}}`);
  armed = [];
  drawPad();
}

const MOD_KEYS = ['Ctrl', 'Shift', 'Alt', 'Gui'];
const GROUPS = [
  ['keys1', [['Left', '←'], ['Down', '↓'], ['Up', '↑'], ['Right', '→'], null,
             ['Home'], ['End'], ['PgUp'], ['PgDn'], null,
             ['Insert'], ['Delete'], ['Backspace']]],
  ['keys2', [['Enter'], ['Tab'], ['Esc'], ['Space'], ['Menu'],
             ['PrintScreen'], ['CapsLock']]],
  ['keys3', [['F1'], ['F2'], ['F3'], ['F4'], ['F5'], ['F6'],
             ['F7'], ['F8'], ['F9'], ['F10'], ['F11'], ['F12']]],
];

function drawPad() {
  $('mods').innerHTML = MOD_KEYS.map(m =>
    `<button class="mod${armed.includes(m) ? ' on' : ''}" data-mod="${m}">${m}</button>`
  ).join('') + `<span class="hint" style="margin-left:.6rem">${t('mods-hint')}</span>`;

  for (const [id, keys] of GROUPS)
    $(id).innerHTML = keys.map(k => k === null ? '<span style="width:.6rem"></span>' :
      `<button data-key="${k[0]}" title="{${k[0]}}">${k[1] || k[0]}</button>`).join('');
}

$('pad').addEventListener('mousedown', e => {
  if (e.target.tagName === 'BUTTON') e.preventDefault();   /* keep the caret */
});

$('pad').addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.mod) {
    armed = armed.includes(t.dataset.mod)
          ? armed.filter(m => m !== t.dataset.mod)
          : [...armed, t.dataset.mod];
    drawPad();
    return;
  }
  if (t.dataset.key) { insertKey(t.dataset.key); return; }

  if (t.dataset.ins === 'key') {
    const c = $('keyval').value;
    if (!c) return;
    /* with no modifier a character is just itself, so say it plainly */
    insert(armed.length ? `{${armed.join('+')}+${c}}` : c);
    armed = []; drawPad();
    $('keyval').value = '';
    return;
  }
  if (t.dataset.ins === 'pause') {
    const v = parseFloat($('pauseval').value);
    if (v >= 0.1 && v <= 25.5) insert(`{pause ${v.toFixed(1)}}`);
    return;
  }
  if (t.dataset.ins === 'rep') {
    const v = parseInt($('repval').value, 10);
    if (v >= 1 && v <= 256) insert(`{${v}}`);
    return;
  }

  /* A count counts the thing before it, and that thing is one keystroke
     unless something says otherwise. Parentheses are how you say otherwise:
     around a selection if there is one, ready to type into if there is not. */
  if (t.dataset.ins === 'goto') {
    if ($('gotoval').value) insert(`{goto ${$('gotoval').value}}`);
    return;
  }

  if (t.dataset.ins === 'group') {
    const el = lastField && lastField.isConnected
             ? lastField : document.querySelector('#list input.text');
    if (!el) return;
    el.focus();
    const a = el.selectionStart, b = el.selectionEnd;
    el.value = el.value.slice(0, a) + '(' + el.value.slice(a, b) + ')'
             + el.value.slice(b);
    /* With something selected the caret goes after the closing bracket, which
       is where the count goes next; with nothing selected it goes inside,
       which is where the thing being grouped goes. */
    const at = a === b ? a + 1 : b + 2;
    el.setSelectionRange(at, at);
    el.dispatchEvent(new Event('input', { bubbles: true }));
    lastField = el;
  }
});

let savedLang = null;
try { savedLang = localStorage.getItem('digimacro.lang'); } catch (e) {}
show('none');
useLang(savedLang || preferredLang());
</script>
