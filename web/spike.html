<!doctype html>
<meta charset="utf-8">
<title>DigiMacro spike</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 3rem auto;
         padding: 0 1rem; color: #16161a; background: #fbfbfd; }
  @media (prefers-color-scheme: dark) { body { color: #e8e8ea; background: #16161a; } }
  button { font: inherit; padding: .5rem 1rem; border-radius: .4rem;
           border: 1px solid currentColor; background: none; color: inherit;
           cursor: pointer; }
  pre { padding: .8rem; border-radius: .4rem; background: #0001; overflow-x: auto; }
  @media (prefers-color-scheme: dark) { pre { background: #fff1; } }
  .ok { color: #0a7d32; } .bad { color: #c02a2a; }
  @media (prefers-color-scheme: dark) { .ok { color: #58d68d; } .bad { color: #ff7b72; } }
</style>

<h1>DigiMacro spike</h1>
<p>Hold the pad for four seconds first, so the board is in vendor mode. Then:</p>
<p><button id="go">Connect</button></p>
<pre id="log">nothing yet</pre>

<script>
const DM_FUNC_INFO = 0x40;
const log = document.getElementById('log');
let lines = [];
const say = (s, cls) => {
  lines.push(cls ? `<span class="${cls}">${s}</span>` : s);
  log.innerHTML = lines.join('\n');
};

document.getElementById('go').onclick = async () => {
  lines = []; log.textContent = '';
  if (!navigator.usb) {
    say('navigator.usb is missing. WebUSB needs Chrome or Edge, over https or '
        + 'localhost.', 'bad');
    return;
  }
  let dev;
  try {
    dev = await navigator.usb.requestDevice(
      { filters: [{ vendorId: 0x16c0, productId: 0x05dc }] });
  } catch (e) {
    say('no device chosen: ' + e.message, 'bad');
    return;
  }
  say(`picked ${dev.manufacturerName} / ${dev.productName}`);
  say(`  ${dev.vendorId.toString(16).padStart(4,'0')}:`
      + `${dev.productId.toString(16).padStart(4,'0')}`
      + `  USB ${dev.usbVersionMajor}.${dev.usbVersionMinor}`);

  try {
    await dev.open();
    say('open() ok', 'ok');
    if (dev.configuration === null) await dev.selectConfiguration(1);
    say('configuration ' + dev.configuration.configurationValue);
    // vendor class, so claiming is allowed -- a HID interface would refuse here
    await dev.claimInterface(0);
    say('claimInterface(0) ok -- the interface is not a protected class', 'ok');
  } catch (e) {
    say('setup failed: ' + e.message, 'bad');
    return;
  }

  try {
    const r = await dev.controlTransferIn({
      requestType: 'vendor', recipient: 'device',
      request: DM_FUNC_INFO, value: 0, index: 0
    }, 4);
    if (r.status !== 'ok') { say('INFO status: ' + r.status, 'bad'); return; }
    const b = new Uint8Array(r.data.buffer);
    const magic = String.fromCharCode(b[0], b[1]);
    say(`INFO -> ${[...b].map(x => x.toString(16).padStart(2,'0')).join(' ')}`);
    say(`  magic "${magic}", protocol ${b[2]}, firmware ${b[3]}`);
    say(magic === 'DM' ? 'the spike works: a keyboard became a WebUSB device.'
                       : 'wrong magic -- talking to something else?',
        magic === 'DM' ? 'ok' : 'bad');
  } catch (e) {
    say('INFO failed: ' + e.message, 'bad');
  }
};
</script>
